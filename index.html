<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mon Carnet Digital</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b1b3a">
<meta name="apple-mobile-web-app-title" content="Mon Carnet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f5f2ea;--card:#fff;--ink:#0b1b3a;--mute:#5b6784;--gold:#a87a10;--goldbg:#f3e3b0;--line:#e2dccb;--red:#b3261e;--green:#1b7a46;--navy:#0b1b3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081330;--card:#112250;--ink:#f6efdc;--mute:#a9b4d0;--gold:#e5bd4f;--goldbg:#3a3213;--line:#233669;--red:#ff8a80;--green:#6fd49b}}
:root[data-theme="dark"]{--bg:#081330;--card:#112250;--ink:#f6efdc;--mute:#a9b4d0;--gold:#e5bd4f;--goldbg:#3a3213;--line:#233669;--red:#ff8a80;--green:#6fd49b}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:22px;margin:0 0 2px;font-weight:800}
h2{font-size:17px;margin:22px 0 8px;font-weight:600}
.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{background:var(--navy);color:#f6efdc;border-radius:18px;padding:20px;margin-bottom:12px}
.hero small{color:#c9d2ea;font-size:14px}
.hero .big{font-size:34px;font-weight:800;color:#e5bd4f;line-height:1.15;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:18px}.stat span{color:var(--mute);font-size:13px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select{width:100%;font:inherit;font-size:16px;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{width:100%;font:inherit;font-size:13px;min-height:110px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
button,.btn{font:inherit;font-weight:600;font-size:15px;border:0;border-radius:10px;padding:10px 14px;background:var(--gold);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
:root:not([data-theme="light"]) button,:root:not([data-theme="light"]) .btn{color:#14100a}
button.ghost,.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.small{padding:6px 10px;font-size:14px;flex:0 0 auto}
button.full{width:100%;margin-top:12px}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}.item .m{color:var(--mute);font-size:13px}
.amt{font-weight:800;white-space:nowrap}.neg{color:var(--red)}.pos{color:var(--green)}
.tag{display:inline-block;background:var(--goldbg);color:var(--gold);border-radius:8px;padding:1px 8px;font-size:12px;font-weight:600}
.empty{color:var(--mute);text-align:center;padding:18px 6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--navy);display:flex;justify-content:center;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:transparent;color:#c9d2ea;padding:6px 2px;font-size:12px;font-weight:600;border-radius:8px}
nav button span{display:block;font-size:20px}
nav button.on{color:#e5bd4f}
:root:not([data-theme="light"]) nav button{color:#c9d2ea}:root:not([data-theme="light"]) nav button.on{color:#e5bd4f}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#f6efdc;border:1px solid #e5bd4f;padding:10px 14px;border-radius:12px;font-size:15px;max-width:90%;z-index:20;text-align:center}
:root:not([data-theme="light"]) button.ghost,:root:not([data-theme="light"]) .btn.ghost{color:var(--ink)}
.row.wrap{flex-wrap:wrap}.row.wrap>*{flex:1 1 38%}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<nav><div class="in" id="nav"></div></nav>
<div id="toast" role="status"></div>
<script>
var KEY='carnet_digital_v1';
var S={sales:[],products:[],clients:[]};
var tab='home';
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.sales&&p.products&&p.clients)S=p;}}catch(e){}
S.shop=S.shop||'';S.boss=S.boss||'';S.emp=S.emp||'';S.pin=S.pin||'';S.exp=S.exp||[];S.epin=S.epin||'';S.ntfy=S.ntfy||'';S.lang=S.lang||(/^en/i.test(navigator.language||'')?'en':'fr');S.sid=S.sid||(Math.random().toString(36)+'000000').slice(2,8).toUpperCase();S.first=S.first||today();S.proUntil=S.proUntil||'';var locked=!!S.pin;save();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){try{note('Mémoire du téléphone pleine : les dernières modifications ne sont pas sauvegardées. Retirez des photos.')}catch(x){}}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return Math.round(n).toLocaleString('fr-FR')+' FCFA'}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dfr(s){var a=s.split('-');return a[2]+'/'+a[1]+'/'+a[0]}
function $(id){return document.getElementById(id)}
var armed=null;
function note(t){var e=$('toast');e.textContent=tr(t);e.style.display='block';clearTimeout(note.t);note.t=setTimeout(function(){e.style.display='none'},2800)}
function ask(key,text,fn){if(armed===key){armed=null;fn()}else{armed=key;note(text+' Appuyez encore pour confirmer.');setTimeout(function(){if(armed===key)armed=null},3500)}}
function go(t){tab=t;editId='';editCid='';pendPic='';render();window.scrollTo(0,0)}
function totalDebt(){return S.clients.reduce(function(a,c){return a+Math.max(0,c.balance)},0)}

var TABS=[['home','🏠','Accueil'],['sales','🧾','Ventes'],['stock','📦','Stock'],['debts','📒','Dettes'],['more','⚙️','Plus']];

function render0(){
  if(locked){$('nav').innerHTML='';$('app').innerHTML=vLock();return}
  $('nav').innerHTML=TABS.filter(function(t){return role!=='emp'||(t[0]!=='bilan'&&t[0]!=='more')}).map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('');
  var v={home:vHome,sales:vSales,stock:vStock,debts:vDebts,bilan:vBilan,pro:vPro,att:vAtt,more:vMore}[tab];
  $('app').innerHTML=langBtn()+(tab==='home'&&role!=='emp'?proBanner():'')+(tab==='sales'?dayCard():'')+(tab==='sales'||tab==='debts'?alertCard():'')+v()+(tab==='home'?(!isPro()?'<button class="ghost full" onclick="go(\'pro\')">🔒 Résumé du jour (Pro)</button>':'<a class="btn" style="display:block;margin-top:12px" target="_blank" rel="noopener" href="'+summaryLink()+'">Envoyer le résumé du jour sur WhatsApp</a>'):'')+(tab==='home'&&S.pin?'<button class="ghost full" onclick="lockNow()">Verrouiller le carnet</button>':'');
}

function vHome(){
  var t=today(),m=t.slice(0,7),day=0,mon=0;
  S.sales.forEach(function(s){if(s.date===t)day+=s.amount;if(s.date.slice(0,7)===m)mon+=s.amount});
  var low=S.products.filter(function(p){return p.qty<=p.min});
  var top=S.clients.filter(function(c){return c.balance>0}).sort(function(a,b){return b.balance-a.balance}).slice(0,3);
  var h='<h1>'+esc(S.shop||'Mon carnet')+'</h1><p class="sub">Vos ventes, votre stock et vos dettes au même endroit.</p>';
  h+='<div class="hero"><small>Ce que vos clients vous doivent</small><div class="big">'+fmt(totalDebt())+'</div></div>';
  h+='<div class="grid"><div class="stat"><span>Ventes du jour</span><b>'+fmt(day)+'</b></div>'+(role==='emp'?'':'<div class="stat"><span>Ventes du mois</span><b>'+fmt(mon)+'</b></div>')+'</div>';
  var nl=S.clients.filter(late).length;if(nl)h+='<div class="card"><b class="neg">'+nl+' client'+(nl>1?'s':'')+' en retard de paiement</b></div>';
  h+='<h2>Plus gros soldes à récupérer</h2><div class="card">';
  h+=top.length?top.map(function(c){return '<div class="item"><div class="t">'+esc(c.name)+'</div><div class="amt neg">'+fmt(c.balance)+'</div></div>'}).join(''):'<div class="empty">Aucune dette pour le moment. Ajoutez un client dans l’onglet Dettes.</div>';
  h+='</div><h2>Produits à réapprovisionner</h2><div class="card">';
  h+=low.length?low.map(function(p){return '<div class="item"><div class="t">'+esc(p.name)+'</div><div class="amt neg">'+p.qty+' en stock</div></div>'}).join(''):'<div class="empty">Aucun produit en stock bas.</div>';
  return h+'</div>';
}

function vSales(){
  var po='<option value="">Aucun produit du stock</option>'+S.products.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+' ('+p.qty+')</option>'}).join('');
  var co='<option value="">Payé comptant</option>'+S.clients.map(function(c){return '<option value="'+c.id+'"'+(c.id===cartCid?' selected':'')+'>À crédit : '+esc(c.name)+'</option>'}).join('');
  var h='<h1>Ventes</h1><p class="sub">Notez chaque vente. Une vente à crédit s’ajoute à la dette du client.</p>';
  h+='<div class="card"><label>Description</label><input id="sl" placeholder="Ex. 2 sacs de riz">';
  h+='<label>Choisir le produit (le stock baisse tout seul)</label><select id="sp" onchange="calc()">'+po+'</select>';
  h+='<div id="sv"></div>';
  h+='<div class="row"><div><label>Quantité</label><input id="sq" oninput="calc()" type="number" inputmode="numeric" min="1" value="1"></div><div><label>Montant (FCFA)</label><input id="sa" type="number" inputmode="numeric" min="0" placeholder="Auto si produit"></div></div>';
  h+='<label>Paiement</label><select id="sc" onchange="cartCid=this.value">'+co+'</select>';
  h+='<label>Moyen de paiement (si payé comptant)</label><select id="sm" onchange="payMode=this.value">'+payOpts()+'</select>';
  h+=cartHtml()+'<button class="ghost full" onclick="addLine()">Ajouter un autre article au panier</button><button class="full" onclick="addSale()">Enregistrer la vente'+(cart.length?' ('+fmt(cartTotal())+')':'')+'</button></div>';
  h+='<h2>Dernières ventes</h2><div class="card">';
  var l=S.sales.slice().reverse().slice(0,30);
  h+=l.length?l.map(function(s,i){var hd=(i===0||l[i-1].date!==s.date)?'<div class="item" style="background:var(--goldbg);border-radius:8px;padding:6px 10px;margin-top:6px"><b>'+dfr(s.date)+'</b><b>'+fmt(dayTotal(s.date))+'</b></div>':'';return hd+'<div class="item"><div><div class="t">'+esc(s.label)+'</div><div class="m">'+dfr(s.date)+(s.time?' à '+s.time:'')+(s.emp?' – '+esc(s.emp):'')+(s.pay&&s.pay!=='Espèces'?' <span class="tag">'+esc(s.pay)+'</span>':'')+(s.client?' <span class="tag">crédit : '+esc(s.client)+'</span>':'')+'</div></div><div style="text-align:right"><div class="amt">'+fmt(s.amount)+'</div>'+(role==='emp'?'':'<button class="ghost small" style="margin-top:4px" onclick="delSale(\''+s.id+'\')">Annuler</button>')+'</div></div>'}).join(''):'<div class="empty">Aucune vente enregistrée.</div>';
  return h+'</div>';
}
function addSaleOld(){
  var pid=$('sp').value,qty=parseInt($('sq').value,10)||1,cid=$('sc').value,amt=parseFloat($('sa').value),label=$('sl').value.trim();
  var p=S.products.filter(function(x){return x.id===pid})[0];
  if(isNaN(amt)&&p&&p.price)amt=p.price*qty;
  if(isNaN(amt)||amt<=0){note('Indiquez un montant.');return}
  if(!label)label=p?p.name+' x'+qty:'Vente';
  if(p)p.qty=Math.max(0,p.qty-qty);
  var c=S.clients.filter(function(x){return x.id===cid})[0],sale={id:uid(),date:today(),label:label,amount:amt,pid:p?p.id:'',qty:qty,cid:c?c.id:'',time:nowt(),emp:S.emp,cost:p?(p.cost||0)*qty:0,nc:(p&&p.cost)?0:1};
  if(c){c.balance+=amt;c.history.push({d:today(),t:'dette',a:amt,n:label});sale.client=c.name}
  S.sales.push(sale);alertTo(shopTag()+'nouvelle vente\n'+label+' : '+fmt(amt)+(c?'\nÀ crédit : '+c.name:'\nPayé comptant')+stamp());save();render();note('Vente enregistrée : '+fmt(amt)+'. Total du jour : '+fmt(dayTotal(today()))+(!p&&S.products.length?'. Aucun produit choisi : stock inchangé.':''));
}

var alertLink='';
function nowt(){return new Date().toTimeString().slice(0,5)}
function shopTag(){return (S.shop||'Boutique')+' : '}
function stamp(){return (S.emp?'\nEmployé : '+S.emp:'')+'\nLe '+dfr(today())+' à '+nowt()}
function bossLink(t){var n=S.boss.replace(/\D/g,'');if(n.length===9)n='237'+n;return 'https://wa.me/'+n+'?text='+encodeURIComponent(tr(t))}
function alertTo(t){alertLink=S.boss?bossLink(t):''}
function alertCard(){if(!alertLink)return '';return '<div class="card" style="border-color:var(--gold)"><div class="t">Prévenir le patron</div><p class="m">Appuyez pour envoyer le résumé sur WhatsApp.</p><a class="btn" style="display:block;margin-top:6px" target="_blank" rel="noopener" onclick="setTimeout(function(){alertLink=\'\';render()},800)" href="'+alertLink+'">Envoyer sur WhatsApp</a><button class="ghost" style="width:100%;margin-top:8px" onclick="alertLink=\'\';render()">Plus tard</button></div>'}
function setQty(id,v){var n=parseInt(v,10);if(isNaN(n)||n<0){note('Indiquez une quantité valide.');render();return}S.products.forEach(function(p){if(p.id===id)p.qty=n});save();render();note('Stock mis à jour.')}
function saveAlert(){S.boss=$('bn').value.trim();S.emp=$('en').value.trim();save();note('Enregistré.')}
var editId='';var bmonth=today().slice(0,7);
TABS.splice(4,0,['bilan','📊','Bilan']);
function dayTotal(d){return S.sales.reduce(function(a,s){return a+(s.date===d?s.amount:0)},0)}
function dayCard(){return rcptCard()+'<div class="hero" style="padding:14px 16px"><small>Total des ventes du jour</small><div class="big" style="font-size:28px">'+fmt(dayTotal(today()))+'</div></div>'}
function calc(){var p=S.products.filter(function(x){return x.id===$('sp').value})[0],q=parseInt($('sq').value,10)||1;if(p&&p.price)$('sa').value=p.price*q;$('sv').innerHTML=p&&p.pic?'<img src="'+p.pic+'" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:10px;margin-top:8px">':''}
function editProd(id){editId=id;pendPic='';render();var p=S.products.filter(function(x){return x.id===id})[0];if(!p)return;$('pn').value=p.name;$('pq').value=p.qty;$('pm').value=p.min;$('pp').value=p.price||'';$('pk').value=p.cost||'';$('pbtn').textContent=tr('Enregistrer les modifications');window.scrollTo(0,0)}
function setM(v){if(v)bmonth=v;render()}
function addExp(){var l=$('xl').value.trim(),a=parseFloat($('xa').value);if(!l||isNaN(a)||a<=0){note('Indiquez la description et le montant.');return}S.exp.push({id:uid(),date:bmonth===today().slice(0,7)?today():bmonth+'-01',label:l,amount:a});save();render();note('Dépense enregistrée.')}
function delExp(id){ask('x'+id,'Supprimer cette dépense ?',function(){S.exp=S.exp.filter(function(e){return e.id!==id});save();render()})}
function vBilan(){if(!isPro())return proWall('Bilan du mois','Découvrez ce que la boutique gagne vraiment chaque mois.');var m=bmonth,rev=0,cr=0,cg=0,nc=0,ex=0;
  S.sales.forEach(function(s){if(s.date.slice(0,7)===m){rev+=s.amount;if(s.client)cr+=s.amount;cg+=s.cost||0;if(s.nc!==0)nc++}});
  var el=S.exp.filter(function(e){return e.date.slice(0,7)===m});el.forEach(function(e){ex+=e.amount});
  var pf=rev-cg-ex;
  var h='<h1>Bilan du mois</h1><p class="sub">Ce que la boutique a vraiment gagné.</p><div class="card"><label style="margin-top:0">Mois</label><input type="month" value="'+m+'" onchange="setM(this.value)"></div>';
  h+='<div class="hero"><small>Bénéfice du mois</small><div class="big" style="'+(pf<0?'color:#ff8a80':'')+'">'+fmt(pf)+'</div>'+(rev?'<small>Marge : '+Math.round(pf/rev*100)+' % des ventes</small>':'')+'</div>';
  h+='<div class="grid"><div class="stat"><span>Ventes</span><b>'+fmt(rev)+'</b></div><div class="stat"><span>Coût des produits vendus</span><b>'+fmt(cg)+'</b></div><div class="stat"><span>Dépenses</span><b>'+fmt(ex)+'</b></div><div class="stat"><span>Dont vendu à crédit</span><b>'+fmt(cr)+'</b></div></div>';
  if(nc)h+='<div class="card"><b class="neg">'+nc+' vente'+(nc>1?'s':'')+' sans prix d’achat.</b><p class="m">Le bénéfice est probablement trop élevé. Renseignez le prix d’achat dans Stock (bouton ✎) et choisissez le produit lors des ventes.</p></div>';
  h+='<h2>Dépenses du mois</h2><div class="card"><label style="margin-top:0">Description</label><input id="xl" placeholder="Ex. Transport, loyer"><label>Montant (FCFA)</label><input id="xa" type="number" inputmode="numeric" min="0"><button class="full" onclick="addExp()">Ajouter la dépense</button></div><div class="card">';
  h+=el.length?el.map(function(e){return '<div class="item"><div><div class="t">'+esc(e.label)+'</div><div class="m">'+dfr(e.date)+'</div></div><div style="text-align:right"><div class="amt">'+fmt(e.amount)+'</div><button class="ghost small" style="margin-top:4px" onclick="delExp(\''+e.id+'\')">Supprimer</button></div></div>'}).join(''):'<div class="empty">Aucune dépense ce mois-ci.</div>';
  return h+'</div>'}
var role='patron';
function lockNow(){locked=true;render()}
function setEpin(){var v=$('pin2').value.trim();if(v&&!isPro()){note('Le mode employé est une fonction Pro.');go('pro');return}if(!S.pin){note('Définissez d’abord le code du patron.');return}if(v&&!/^\d{4,8}$/.test(v)){note('Le code doit avoir 4 à 8 chiffres.');return}if(v&&v===S.pin){note('Le code employé doit être différent.');return}S.epin=v;save();note(v?'Code employé activé.':'Code employé retiré.')}
function vStockEmp(){var h='<h1>Stock</h1><p class="sub">Quantités disponibles. Pour modifier le stock, voyez le patron.</p><div class="card">';h+=S.products.length?S.products.map(function(p){return '<div class="item"><div>'+(p.pic?'<img src="'+p.pic+'" alt="" style="float:left;margin-right:10px;width:44px;height:44px;object-fit:cover;border-radius:8px">':'')+'<div class="t">'+esc(p.name)+'</div><div class="m">'+(p.price?fmt(p.price)+' l’unité':'')+'</div></div><div class="amt '+(p.qty<=p.min?'neg':'')+'">'+p.qty+'</div></div>'}).join(''):'<div class="empty">Aucun produit.</div>';return h+'</div>'}
var cart=[],cartCid='',lastGrp='';
function curLine(){var pid=$('sp').value,qty=parseInt($('sq').value,10)||1,amt=parseFloat($('sa').value),label=$('sl').value.trim();
  var p=S.products.filter(function(x){return x.id===pid})[0];
  if(isNaN(amt)&&p&&p.price)amt=p.price*qty;
  if(isNaN(amt)||amt<=0)return null;
  if(!label)label=p?p.name+' x'+qty:'Vente';
  return {pid:p?p.id:'',qty:qty,label:label,amount:amt}}
function addLine(){var l=curLine();if(!l){note('Indiquez un montant.');return}cart.push(l);render();note('Article ajouté au panier.')}
function cartTotal(){return cart.reduce(function(a,l){return a+l.amount},0)}
function cartHtml(){if(!cart.length)return '';return '<div style="margin-top:12px">'+cart.map(function(l,i){return '<div class="item"><div class="t">'+esc(l.label)+'</div><div class="row" style="flex:0 0 auto"><b>'+fmt(l.amount)+'</b><button class="ghost small" onclick="cart.splice('+i+',1);render()" aria-label="Retirer">✕</button></div></div>'}).join('')+'</div>'}
function addSale(){var lines=cart.slice(),l=curLine();if(l)lines.push(l);
  if(!lines.length){note('Indiquez un montant.');return}
  var over=lines.filter(function(ln){var p=S.products.filter(function(x){return x.id===ln.pid})[0];return p&&ln.qty>p.qty});
  if(over.length&&armed!=='over'){ask('over','Stock insuffisant : '+over.map(function(l){return l.label}).join(', ')+'.',function(){});return}
  armed=null;
  var c=S.clients.filter(function(x){return x.id===$('sc').value})[0],g=uid(),tot=0,det=[],miss=0;
  lines.forEach(function(ln){var p=S.products.filter(function(x){return x.id===ln.pid})[0];
    if(p)p.qty=Math.max(0,p.qty-ln.qty);else if(S.products.length)miss=1;
    var s={id:uid(),grp:g,date:today(),label:ln.label,amount:ln.amount,pid:ln.pid,qty:ln.qty,cid:c?c.id:'',time:nowt(),emp:S.emp,pay:c?'':payMode,cost:p?(p.cost||0)*ln.qty:0,nc:(p&&p.cost)?0:1};
    if(c){c.balance+=ln.amount;c.history.push({d:today(),t:'dette',a:ln.amount,n:ln.label});s.client=c.name}
    S.sales.push(s);tot+=ln.amount;det.push(ln.label+' : '+fmt(ln.amount))});
  cart=[];lastGrp=g;payMode='Espèces';
  alertTo(shopTag()+'nouvelle vente\n'+det.join('\n')+'\nTotal : '+fmt(tot)+(c?'\nÀ crédit : '+c.name:'\nPayé comptant')+stamp());
  pushN(shopTag()+'nouvelle vente '+fmt(tot)+(c?' (crédit)':'')+(S.emp?' – '+S.emp:'')+' – '+nowt());save();render();note('Vente enregistrée : '+fmt(tot)+'. Total du jour : '+fmt(dayTotal(today()))+(miss?'. Article sans produit choisi : stock inchangé.':''))}

  var tot=ss.reduce(function(a,s){return a+s.amount},0);
  var t=(S.shop||'Boutique')+'\nReçu du '+dfr(ss[0].date)+' à '+ss[0].time+'\n'+ss.map(function(s){return s.label+' : '+fmt(s.amount)}).join('\n')+'\nTotal : '+fmt(tot)+(c?'\nÀ crédit. Solde : '+fmt(c.balance):'\nPayé comptant')+'\nMerci de votre confiance !';

  return 'https://wa.me/'+n+'?text='+encodeURIComponent(tr(msg));
}

  catch(e){note('Sauvegarde non valide. Collez le texte complet.')}
